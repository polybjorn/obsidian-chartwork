# Read by the CI dependency gate (osv-scanner).

# A crafted extglob can make picomatch backtrack for a long time. It comes in
# only through typescript-eslint (typescript-estree -> tinyglobby), which globs
# this repo's own tsconfig file patterns and never ships in main.js, and no
# picomatch release fixes it yet. The date makes the gate fail again, so the
# ignore is rechecked rather than kept for good.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-18
reason = "picomatch <= 4.0.7 is dev-only, through typescript-eslint's tinyglobby, which globs this repo's own files; no fixed picomatch release exists yet"
